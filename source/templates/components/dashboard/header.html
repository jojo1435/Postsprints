<header class="sticky top-0 flex justify-between items-center gap-x-4 px-6 py-4 bg-base-100 border-b border-base-300 z-20">
    <button
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
        class="block lg:hidden h-6 w-6 hover:text-primary cursor-pointer transition-colors"
        data-dashboard="button">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
    </button>
    <details class="dropdown ml-auto">
        <summary class="dropdown-summary list-none flex items-center gap-x-3 cursor-pointer">
            <div class="avatar avatar-placeholder" aria-hidden="true">
                <div class="bg-neutral text-neutral-content w-8 rounded-full">
                    <span class="text-xs">{{ current_user.name.split()[0][0] }}</span>
                </div>
            </div>
            <p class="hidden sm:block text-md font-semibold mt-1">
                {{ current_user.name.split()[0][:20] }} {{ current_user.name.split()[1][:20] if current_user.name.split()|length > 1 else "" }}
            </p>
        </summary>
        <div class="dropdown-content right-0 mt-2 p-4 w-48 rounded-sm bg-base-100 shadow-lg ring-1 ring-base-300 z-20" role="menu">
            <a href="{{ url_for('auth.signout') }}"
               role="menuitem"
               class="flex items-center gap-3 text-base rounded-md font-bold px-3 py-2 hover:bg-base-200 transition-colors">
                <svg aria-hidden="true" stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 256 256" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
                    <path d="M112,216a8,8,0,0,1-8,8H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32h56a8,8,0,0,1,0,16H48V208h56A8,8,0,0,1,112,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L196.69,120H104a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,221.66,122.34Z"></path>
                </svg>
                Sign out
            </a>
        </div>
    </details>
    <button type="button" id="theme-toggle" aria-label="Toggle theme" class="btn btn-ghost btn-sm">
        <svg id="icon-light" class="hidden w-5 h-5" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg id="icon-dark" class="w-5 h-5" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
    </button>
</header>
