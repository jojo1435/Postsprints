{% extends "layout.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="flex relative max-h-screen">
    {% include "components/dashboard/sidebar.html" %}
    <div class="flex flex-col w-full h-screen overflow-y-auto bg-(--color-base-50)">
        {% include "components/dashboard/header.html" %}
        <section aria-labelledby="dashboard-title" class="py-5 border-b border-base-300">
            <h1 id="dashboard-title" class="text-3xl font-medium tracking-tight px-6 font-manrope">Dashboard</h1>
        </section>
        <main class="w-full h-[calc(100vh-142px)]">
            <div class="p-6 h-full">
                <div class="flex justify-center items-center w-full h-full rounded-xl border border-dashed border-base-300"></div>
            </div>
        </main>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script type="text/javascript" src="{{ asset_url('javascript/sidebar.js') }}"></script>
{% endblock %}
