{% extends "layout.html" %}

{% block title %}Verify your account{% endblock %}

{% block content %}
<div class="min-h-dvh bg-(--color-base-50)">
	<div class="px-4 md:px-6 w-full">
		<header class="flex justify-center md:justify-start pt-5">
			<a href="{{ url_for('main.index') }}">
				<picture>
					<source class="w-55" srcset="{{ asset_url('images/header_logo.png') }}" media="(prefers-color-scheme: light)" alt="Postsprints logo"/>
					<source class="w-55" srcset="{{ asset_url('images/header_logo_dark.png') }}" media="(prefers-color-scheme: dark)" alt="Postsprints logo"/>
					<img class="w-55" src="{{ asset_url('images/header_logo.png') }}" alt="Postsprints logo">
				</picture>
			</a>
		</header>
		<main class="flex flex-col justify-center items-center pr-0 xl:pr-6 py-6 min-h-[calc(100dvh-93px)] text-center">
			<svg class="text-primary mb-6 sm:mb-10 h-20 sm:h-26 lg:h-40" stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
				<path d="M256 48a208 208 0 1 1 0 416 208 208 0 1 1 0-416zm0 464A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0l-111 111-47-47c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l64 64c9.4 9.4 24.6 9.4 33.9 0L369 209z"></path>
			</svg>
			<h1 class="text-4xl sm:text-5xl font-semibold font-manrope">Verify Your Email</h1>
			<p class="text-md text-neutral my-4 sm:my-6 font-medium max-w-md">We've sent a verification link to your email address. Please check your inbox to activate your account.</p>
		</main>
	</div>
</div>
{% endblock %}
